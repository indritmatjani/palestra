<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra</title>
<meta name="description" content="Tracker allenamenti: progressi, timer, muscoli">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
/* tema applicato subito (prima del CSS) per evitare il "lampo" di colore sbagliato */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('palestra-app-v1') || '{}').settings || {};
    var t = s.theme === 'light' || s.theme === 'dark' ? s.theme
      : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <h1 id="topbar-title">Palestra</h1>
    <button id="topbar-action" class="btn-ghost hidden"></button>
  </header>

  <main id="view"></main>

  <!-- Timer bar (appare quando un timer è attivo) -->
  <div id="timerbar" class="hidden" role="timer" aria-live="off">
    <div class="timer-info">
      <span id="timer-label">Recupero</span>
      <span id="timer-remaining">0:00</span>
    </div>
    <div class="timer-progress"><div id="timer-fill"></div></div>
    <div class="timer-actions">
      <button id="timer-minus" class="btn-mini">−30s</button>
      <button id="timer-plus" class="btn-mini">+30s</button>
      <button id="timer-stop" class="btn-mini danger">Stop</button>
    </div>
  </div>

  <nav id="tabbar" aria-label="Sezioni">
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 8h-3v10h-4v-6h-4v6H6V11H3z"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-view="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10h2v4H4zM18 10h2v4h-2zM7 7h2v10H7zM15 7h2v10h-2zM9 11h6v2H9z"/></svg>
      <span>Allena</span>
    </button>
    <button class="tab" data-view="charts">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16v2H4zM5 12l4-4 3 3 5-6 2 1.5-6.7 8L9 11l-3 3z"/></svg>
      <span>Grafici</span>
    </button>
    <button class="tab" data-view="muscles">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a4 4 0 014 4c0 1.5-.8 2.8-2 3.5V11c3 .5 5 2 5 4.5V22h-2v-6c0-1.5-2-2.5-5-2.5S7 14.5 7 16v6H5v-6.5C5 13 7 11.5 10 11V9.5A4 4 0 018 6a4 4 0 014-4z"/></svg>
      <span>Muscoli</span>
    </button>
    <button class="tab" data-view="cardio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg>
      <span>Cardio</span>
    </button>
    <button class="tab" data-view="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
      <span>Profilo</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script src="js/data.js"></script>
<script src="js/muscles.js"></script>
<script src="js/charts.js"></script>
<script src="js/exlib.js"></script>
<script src="js/cardio.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // updateViaCache:'none' → il browser ricontrolla sempre sw.js (niente versioni bloccate)
  let reloaded = false;
  const safeReload = () => {
    if (reloaded) return;
    if (window.__busyNow && window.__busyNow()) { setTimeout(safeReload, 15000); return; }
    reloaded = true; location.reload();
  };
  // nuovo SW attivo → ricarica (mai durante un timer, un cardio o una seduta in corso)
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) safeReload(); });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update();
      // controlla aggiornamenti quando torni sull'app e ogni 30 min:
      // così l'app si aggiorna DA SOLA, senza mai cancellare cache o reinstallare
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
      setInterval(() => reg.update(), 30 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
</body>
</html>
