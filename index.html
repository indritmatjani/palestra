<!DOCTYPE html>
<html lang="it" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palestra</title>
<meta name="description" content="Tracker allenamenti: progressi, timer, muscoli">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>
/* tema applicato subito (prima del CSS) per evitare il "lampo" di colore sbagliato */
(function () {
  try {
    var s = JSON.parse(localStorage.getItem('palestra-app-v1') || '{}').settings || {};
    var t = s.theme === 'light' || s.theme === 'dark' ? s.theme
      : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
    var sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
    if (sb && t === 'light') sb.setAttribute('content', 'default');
  } catch (e) {}
})();
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app">
  <header id="topbar">
    <span></span>
    <div id="topbar-title" aria-hidden="true">Palestra</div>
    <button id="topbar-action" class="btn-ghost hidden"></button>
  </header>

  <main id="view"></main>

  <!-- Timer bar (appare quando un timer è attivo) -->
  <div id="timerbar" class="hidden" role="timer" aria-live="off">
    <div class="timer-info">
      <span id="timer-label">Recupero</span>
      <span id="timer-remaining">0:00</span>
    </div>
    <div class="timer-progress"><div id="timer-fill"></div></div>
    <div class="timer-actions">
      <button id="timer-minus" class="btn-mini">−30s</button>
      <button id="timer-plus" class="btn-mini">+30s</button>
      <button id="timer-stop" class="btn-mini danger">Stop</button>
    </div>
  </div>

  <nav id="tabbar" aria-label="Sezioni">
    <button class="tab active" data-view="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l8.5 7.3V20a1 1 0 01-1 1h-5v-6h-5v6h-5a1 1 0 01-1-1v-9.5z"/></svg>
      <span>Home</span>
    </button>
    <button class="tab" data-view="workout">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 10h1.5v4H2.5zM20 10h1.5v4H20zM5 6.5h3v11H5zM16 6.5h3v11h-3zM8 11h8v2H8z"/></svg>
      <span>Allena</span>
    </button>
    <button class="tab" data-view="cardio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21l-1.4-1.3C5.4 15 2 11.9 2 8.2 2 5.3 4.3 3 7.2 3c1.7 0 3.6.9 4.8 2.3C13.2 3.9 15.1 3 16.8 3 19.7 3 22 5.3 22 8.2c0 3.7-3.4 6.8-8.6 11.5z"/></svg>
      <span>Cardio</span>
    </button>
    <button class="tab" data-view="progress">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h3.5V12H4zM10.25 20h3.5V4h-3.5zM16.5 20H20v-11h-3.5z"/></svg>
      <span>Progressi</span>
    </button>
    <button class="tab" data-view="profile">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm0 2c-4.4 0-8 2.2-8 5v1.5h16V19c0-2.8-3.6-5-8-5z"/></svg>
      <span>Profilo</span>
    </button>
  </nav>
</div>

<div id="modal-root"></div>

<script src="js/data.js"></script>
<script src="js/muscles.js"></script>
<script src="js/charts.js"></script>
<script src="js/exlib.js"></script>
<script src="js/cardio.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  // updateViaCache:'none' → il browser ricontrolla sempre sw.js (niente versioni bloccate)
  let reloaded = false;
  const safeReload = () => {
    if (reloaded) return;
    if (window.__busyNow && window.__busyNow()) { setTimeout(safeReload, 15000); return; }
    reloaded = true; location.reload();
  };
  // nuovo SW attivo → ricarica (mai durante un timer, un cardio o una seduta in corso)
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController) safeReload(); });

  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
      reg.update();
      // controlla aggiornamenti quando torni sull'app e ogni 30 min:
      // così l'app si aggiorna DA SOLA, senza mai cancellare cache o reinstallare
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update(); });
      setInterval(() => reg.update(), 30 * 60 * 1000);
    }).catch(() => {});
  });
}
</script>
</body>
</html>
